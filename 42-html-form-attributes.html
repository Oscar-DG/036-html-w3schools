<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lección 42 - HTML Form Attributes</title>

</head>

<body>

    <h1>Atributos de Formularios HTML</h1>

    <form action="#" method="post" target="_blank" autocomplete="on">

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" name="correo"><br><br>

        <input type="submit" value="Enviar">

    </form>

    <hr>

    <h2>Formulario con novalidate</h2>

    <form action="#" novalidate>

        <label for="usuario">Usuario:</label><br>
        <input type="text" id="usuario" name="usuario"><br><br>

        <input type="submit" value="Enviar sin validar">

    </form>

</body>

</html>
