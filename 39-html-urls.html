<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lección 39 - HTML URLs</title>

</head>

<body>

    <h1>HTML URLs</h1>

    <p>Ejemplo de una URL absoluta:</p>

    <a href="https://www.w3schools.com" target="_blank">
        Visitar W3Schools
    </a>

    <hr>

    <p>Ejemplo de una URL relativa:</p>

    <a href="38-html-encoding.html">
        Ir a la página principal
    </a>

    <hr>

    <h2>Ejemplos de esquemas (Schemes)</h2>

    <ul>
        <li>https://www.google.com</li>
        <li>http://example.com</li>
        <li>ftp://ftp.example.com</li>
        <li>file:///C:/Documentos/index.html</li>
    </ul>

</body>

</html>
