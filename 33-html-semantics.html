<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Lección 33 - HTML Semantics</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header, nav, section, article, aside, footer{
            border: 1px solid gray;
            padding: 15px;
            margin: 10px 0;
        }

        header, footer{
            background-color: steelblue;
            color: white;
        }

        nav{
            background-color: lightgray;
        }

        aside{
            background-color: aliceblue;
        }

        figure{
            text-align: center;
        }

    </style>

</head>

<body>

    <header>

        <h1>Mi Página Web</h1>

    </header>

    <nav>

        <a href="#">Inicio</a> |
        <a href="#">Acerca</a> |
        <a href="#">Contacto</a>

    </nav>

    <main>

        <section>

            <h2>Noticias</h2>

            <article>

                <h3>Desarrollo Web</h3>

                <p>HTML permite crear la estructura de una página web utilizando elementos semánticos.</p>

            </article>

        </section>

        <aside>

            <h3>Dato curioso</h3>

            <p>HTML5 incorporó muchas etiquetas semánticas para mejorar la organización del código.</p>

        </aside>

        <figure>

            <img src="https://picsum.photos/300/180" alt="Imagen de ejemplo">

            <figcaption>Figura 1. Imagen de ejemplo.</figcaption>

        </figure>

    </main>

    <footer>

        <p>© 2026 Oscar García</p>

    </footer>

</body>

</html>
