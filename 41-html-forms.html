<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lección 41 - HTML Forms</title>

</head>

<body>

    <h1>Formulario HTML</h1>

    <form action="#">

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido"><br><br>

        <p>Lenguaje favorito:</p>

        <input type="radio" id="html" name="lenguaje" value="HTML">
        <label for="html">HTML</label><br>

        <input type="radio" id="css" name="lenguaje" value="CSS">
        <label for="css">CSS</label><br>

        <input type="radio" id="javascript" name="lenguaje" value="JavaScript">
        <label for="javascript">JavaScript</label><br><br>

        <p>Tengo:</p>

        <input type="checkbox" id="laptop" name="laptop">
        <label for="laptop">Laptop</label><br>

        <input type="checkbox" id="pc" name="pc">
        <label for="pc">Computadora de escritorio</label><br>

        <input type="checkbox" id="tablet" name="tablet">
        <label for="tablet">Tablet</label><br><br>

        <input type="submit" value="Enviar">

    </form>

</body>

</html>
