<!DOCTYPE html>
<html lang="es">

<head>
    <title>Lección 13 - HTML Colors</title>
</head>

<body>

    <h1 style="background-color:DodgerBlue; color:white;">
        Colores en HTML
    </h1>

    <p style="background-color:Tomato;">
        Este párrafo tiene fondo rojo tomate.
    </p>

    <p style="color:MediumSeaGreen;">
        Este texto es de color verde.
    </p>

    <h2 style="border:2px solid Violet;">
        Este encabezado tiene un borde violeta.
    </h2>

    <h2 style="background-color:rgb(255, 99, 71);">
        Color usando RGB
    </h2>

    <h2 style="background-color:#ff6347;">
        Color usando HEX
    </h2>

    <h2 style="background-color:hsl(9, 100%, 64%);">
        Color usando HSL
    </h2>

</body>

</html>
