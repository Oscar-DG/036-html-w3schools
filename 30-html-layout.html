<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lección 30 - HTML Layout</title>

    <style>

        *{
            font-family: Arial, sans-serif;
        }

        header{
            background-color: steelblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav{
            background-color: lightgray;
            padding: 10px;
        }

        section{
            padding: 20px;
        }

        article{
            background-color: aliceblue;
            padding: 15px;
            border: 1px solid gray;
        }

        footer{
            background-color: steelblue;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <header>
        <h1>Mi Sitio Web</h1>
    </header>

    <nav>

        <a href="#">Inicio</a> |
        <a href="#">Cursos</a> |
        <a href="#">Contacto</a>

    </nav>

    <section>

        <article>

            <h2>Desarrollo Web</h2>

            <p>
                Esta sección muestra un ejemplo de la estructura
                de una página utilizando etiquetas semánticas.
            </p>

        </article>

    </section>

    <footer>

        <p>© 2026 Oscar García</p>

    </footer>

</body>

</html>
