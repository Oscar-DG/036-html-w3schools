<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lección 31 - HTML Responsive</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: aliceblue;
        }

        h1{
            text-align: center;
            color: steelblue;
        }

        img{
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <h1>Página Responsive</h1>

    <p>
        Esta página se adapta automáticamente al tamaño de la pantalla.
    </p>

    <img src="https://picsum.photos/800/400" alt="Imagen Responsive">

    <p>
        Si reduces el tamaño de la ventana del navegador,
        la imagen también cambiará de tamaño.
    </p>

</body>

</html>
