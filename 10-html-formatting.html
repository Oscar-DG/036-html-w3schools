<!DOCTYPE html>
<html lang="es">

<head>
    <title>Lección 10 - HTML Formatting</title>
</head>

<body>

    <h1>Formato de Texto en HTML</h1>

    <p><b>Este texto está en negrita.</b></p>

    <p><strong>Este texto es importante.</strong></p>

    <p><i>Este texto está en cursiva.</i></p>

    <p><em>Este texto tiene énfasis.</em></p>

    <p>Recuerda estudiar <mark>HTML</mark> todos los días.</p>

    <p><small>Este texto es más pequeño.</small></p>

    <p>Mi color favorito era <del>azul</del> <ins>negro</ins>.</p>

    <p>La fórmula del agua es H<sub>2</sub>O.</p>

    <p>2<sup>3</sup> = 8.</p>

</body>

</html>
