<!DOCTYPE html>
<html lang="es">

<head>

    <title>Lección 25 - HTML Buttons</title>

    <style>

        button{
            background-color: steelblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Botones en HTML</h1>

    <button type="button">Botón Normal</button>

    <button type="submit">Botón Submit</button>

    <button type="reset">Botón Reset</button>

    <button disabled>Botón Deshabilitado</button>

</body>

</html>
