<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lección 44 - HTML Input Types</title>

</head>

<body>

    <h1>Tipos de Input en HTML</h1>

    <form action="#">

        <label>Texto:</label><br>
        <input type="text"><br><br>

        <label>Contraseña:</label><br>
        <input type="password"><br><br>

        <label>Correo:</label><br>
        <input type="email"><br><br>

        <label>Número:</label><br>
        <input type="number" min="1" max="10"><br><br>

        <label>Fecha:</label><br>
        <input type="date"><br><br>

        <label>Hora:</label><br>
        <input type="time"><br><br>

        <label>Color favorito:</label><br>
        <input type="color"><br><br>

        <label>Archivo:</label><br>
        <input type="file"><br><br>

        <label>Volumen:</label><br>
        <input type="range" min="0" max="100"><br><br>

        <label>Buscar:</label><br>
        <input type="search"><br><br>

        <label>Teléfono:</label><br>
        <input type="tel"><br><br>

        <label>Página web:</label><br>
        <input type="url"><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>

</body>

</html>
