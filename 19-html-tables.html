<!DOCTYPE html>
<html lang="es">

<head>

    <title>Lección 19 - HTML Tables</title>

    <style>

        table{
            width: 60%;
            border-collapse: collapse;
        }

        table, th, td{
            border: 1px solid black;
        }

        th, td{
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: lightblue;
        }

    </style>

</head>

<body>

    <h1>Tabla de Estudiantes</h1>

    <table>

        <tr>
            <th>Nombre</th>
            <th>Carrera</th>
            <th>Semestre</th>
        </tr>

        <tr>
            <td>Oscar García</td>
            <td>Ingeniería en Sistemas</td>
            <td>Sexto</td>
        </tr>

        <tr>
            <td>María López</td>
            <td>Administración</td>
            <td>Cuarto</td>
        </tr>

        <tr>
            <td>Carlos Pérez</td>
            <td>Contaduría</td>
            <td>Segundo</td>
        </tr>

    </table>

</body>

</html>
