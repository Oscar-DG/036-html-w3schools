<!DOCTYPE html>

<head>
    <title>Lección 16 - HTML Images</title>
</head>

<body>

    <h1>Imágenes en HTML</h1>

    <p>Ejemplo de una imagen desde Internet:</p>

    <img
        src="https://www.w3schools.com/images/w3schools_green.jpg"
        alt="Logo de W3Schools"
        width="220">

    <hr>

    <p>Imagen con tamaño diferente:</p>

    <img
        src="https://www.w3schools.com/images/w3schools_green.jpg"
        alt="Logo de W3Schools"
        width="120"
        height="120">

</body>
